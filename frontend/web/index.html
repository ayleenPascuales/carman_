<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Carman es la plataforma de alquiler de coches entre particulares: reserva, abre el vehículo desde el móvil y viaja con seguro a todo riesgo.">
  <meta name="theme-color" content="#7C5AF6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Carman">

  <meta property="og:title" content="Carman · Movilidad reimaginada">
  <meta property="og:description" content="Alquiler de coches entre particulares con llave digital, seguro Premium y vehículos verificados.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Carman · Movilidad reimaginada</title>

  <style>
    :root {
      color-scheme: light;
      --carman-violet: #7c5af6;
      --carman-deep: #6b38d4;
      --carman-graphite: #171717;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: #f5f5f5;
    }

    #carman-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background:
        radial-gradient(circle at 50% 24%, rgba(139, 92, 246, 0.18), transparent 46%),
        #f5f5f5;
      transition: opacity 240ms ease;
      font-family: Manrope, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    #carman-splash.is-hidden { opacity: 0; pointer-events: none; }

    .carman-mark {
      width: 76px;
      height: 76px;
      border-radius: 23px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--carman-violet), var(--carman-deep));
      box-shadow: 0 18px 38px -12px rgba(139, 92, 246, 0.65);
    }

    .carman-mark svg { width: 42px; height: 42px; fill: #ffffff; }

    .carman-wordmark {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.9px;
      color: var(--carman-graphite);
    }

    .carman-tagline {
      margin-top: 2px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2.1px;
      color: #7b7486;
      text-align: center;
    }

    .carman-loader {
      width: 34px;
      height: 4px;
      margin-top: 8px;
      border-radius: 99px;
      background: #ede9fe;
      overflow: hidden;
    }

    .carman-loader::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--carman-violet), var(--carman-deep));
      animation: carman-loading 1.1s ease-in-out infinite alternate;
    }

    @keyframes carman-loading {
      from { transform: translateX(-15%); }
      to { transform: translateX(165%); }
    }
  </style>
</head>
<body>
  <div id="carman-splash" role="status" aria-label="Cargando Carman">
    <div class="carman-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
    </div>
    <div>
      <div class="carman-wordmark">Carman</div>
      <div class="carman-tagline">MOBILITY REIMAGINED</div>
    </div>
    <div class="carman-loader" aria-hidden="true"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('carman-splash');
      if (!splash) return;
      splash.classList.add('is-hidden');
      window.setTimeout(function () { splash.remove(); }, 260);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
